<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        user=prompt("Enter Your user Name")
        role=prompt("Enter Your Role EG: admin, customer")
        productname=prompt("Enter Product Name")

        class Product{
            _productName;

            get ProductName(){
                return this._productName;
            }

            set ProductName(newName){
                if(role==='admin'){
                    this._productName=newName
                }else{
                    document.write(`Hello ${user} You are not authorized Person`)
                }
            }
        }

        let obj=new Product()

        obj.ProductName=productname;

        if(obj.ProductName){
            document.write(`product name => ${obj.ProductName}`)
        }
    </script>
</body>
</html>
