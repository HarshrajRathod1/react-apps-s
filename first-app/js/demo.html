<head>

<body>
    <script>
        class Demo{
            static s=0;
            n=0;
            print(){
                Demo.s=Demo.s+1
                this.n=this.n + 1
                document.write(`s=${Demo.s} n=${this.n} <br>`)
            }
        }

        let obj1=new Demo()
        obj1.print()

        let obj2=new Demo()
        obj2.print()

        let obj3=new Demo()
        obj3.print()

        class Product{
            Name="TV"
            #price=12000
            _stock=true

            print(){
                document.write(`Name=${this.Name}<br> Price=${this.#price}<br> Stock=${this._stock}`)
            }
        }

        let obj=new Product()

        obj.print()

    </script>
</body>
